         not resolve a relative path. -->

    <meta property="og:site_name" content="Learn Spanish by Playing" />
    <meta property="og:title" content="Learn Spanish by Playing — One-to-One Spanish Lessons" />

      property="og:description"

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:title" content="Learn Spanish by Playing" />

      name="twitter:description"
